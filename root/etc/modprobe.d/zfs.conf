# Cap ZFS ARC at 5 GiB (5368709120 bytes) on 32 GiB host to leave 22 GiB for Talos KVM.
# Empirical pool telemetry: metadata (1.02 GiB) + MFU hot blocks (0.79 GiB) = 1.81 GiB.
# 5 GiB provides 2.75x coverage of the critical working set plus >3 GiB sequential prefetch.
options zfs zfs_arc_max=5368709120
